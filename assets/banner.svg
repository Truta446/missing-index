<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="missing-index — find the index your slow query is missing">
  <title>missing-index — find the index your slow query is missing</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071A1C"/>
      <stop offset="55%" stop-color="#08171F"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#5EEAD4"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.11"/>
      <stop offset="60%" stop-color="#2DD4BF" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#FFFFFF" opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="1200" height="480" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="480" rx="14" fill="url(#dots)"/>
  <ellipse cx="900" cy="200" rx="460" ry="330" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="479" rx="14" fill="none" stroke="#FFFFFF" stroke-opacity="0.07"/>

  <!-- ── left column ─────────────────────────────────────────────── -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

    <g transform="translate(56, 60)">
      <rect x="0" y="0" width="180" height="28" rx="14" fill="#2DD4BF" fill-opacity="0.12" stroke="#2DD4BF" stroke-opacity="0.32"/>
      <text x="90" y="19" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5EEAD4" letter-spacing="1.5">INDEX TUNING</text>
    </g>

    <text x="54" y="168" font-size="56" font-weight="800" letter-spacing="-1.8" fill="#E6EDF3">missing<tspan fill="url(#accent)">-index</tspan></text>

    <text x="56" y="212" font-size="21" font-weight="600" fill="#C9D1D9">Find the index your slow query is missing.</text>
    <text x="56" y="242" font-size="16.5" fill="#8B949E">And get the CREATE INDEX that fixes it.</text>

    <g font-size="14.5" fill="#8B949E">
      <g transform="translate(56, 292)">
        <circle cx="4" cy="-4.5" r="3.2" fill="#FBBF24"/>
        <text x="20" y="0" xml:space="preserve"><tspan fill="#C9D1D9" font-weight="600">Explains the slow ones. </tspan>Fast queries cost nothing.</text>
      </g>
      <g transform="translate(56, 322)">
        <circle cx="4" cy="-4.5" r="3.2" fill="#FBBF24"/>
        <text x="20" y="0" xml:space="preserve"><tspan fill="#C9D1D9" font-weight="600">Names the line. </tspan>Not just the table.</text>
      </g>
      <g transform="translate(56, 352)">
        <circle cx="4" cy="-4.5" r="3.2" fill="#FBBF24"/>
        <text x="20" y="0" xml:space="preserve"><tspan fill="#C9D1D9" font-weight="600">Never runs it for you. </tspan>An index is a trade-off.</text>
      </g>
    </g>

    <g transform="translate(56, 400)" font-size="12" font-weight="600" fill="#8B949E">
      <g>
        <rect x="0" y="0" width="88" height="26" rx="6" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.09"/>
        <text x="44" y="17.5" text-anchor="middle">PostgreSQL</text>
      </g>
      <g transform="translate(96, 0)">
        <rect x="0" y="0" width="60" height="26" rx="6" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.09"/>
        <text x="30" y="17.5" text-anchor="middle">Drizzle</text>
      </g>
      <g transform="translate(164, 0)">
        <rect x="0" y="0" width="72" height="26" rx="6" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.09"/>
        <text x="36" y="17.5" text-anchor="middle">TypeORM</text>
      </g>
      <g transform="translate(244, 0)">
        <rect x="0" y="0" width="52" height="26" rx="6" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.09"/>
        <text x="26" y="17.5" text-anchor="middle">Knex</text>
      </g>
      <g transform="translate(304, 0)">
        <rect x="0" y="0" width="60" height="26" rx="6" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.09"/>
        <text x="30" y="17.5" text-anchor="middle">Kysely</text>
      </g>
      <g transform="translate(372, 0)">
        <rect x="0" y="0" width="68" height="26" rx="6" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.09"/>
        <text x="34" y="17.5" text-anchor="middle">raw SQL</text>
      </g>
    </g>
  </g>

  <!-- ── right column: the report ────────────────────────────────── -->
  <g transform="translate(608, 58)">
    <rect x="0" y="0" width="536" height="272" rx="11" fill="#010B0D" fill-opacity="0.82" stroke="#FFFFFF" stroke-opacity="0.11"/>

    <circle cx="20" cy="21" r="5" fill="#FF5F57"/>
    <circle cx="38" cy="21" r="5" fill="#FEBC2E"/>
    <circle cx="56" cy="21" r="5" fill="#28C840"/>
    <line x1="0" y1="42" x2="536" y2="42" stroke="#FFFFFF" stroke-opacity="0.08"/>

    <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" xml:space="preserve">
      <text x="22" y="74" fill="#6E7681">$ <tspan fill="#C9D1D9">npm run dev</tspan></text>

      <text x="22" y="112" fill="#8B949E"><tspan fill="#E6EDF3" font-weight="700">missing-index</tspan> <tspan fill="#FBBF24" font-weight="700">sequential scan</tspan> on <tspan fill="#E6EDF3" font-weight="700">orders</tspan></text>
      <text x="22" y="131" fill="#6E7681">read ~60,000 rows to return ~12, 4ms</text>

      <text x="22" y="163" fill="#6E7681">query  <tspan fill="#C9D1D9">SELECT * FROM orders WHERE user_id = $1</tspan></text>
      <text x="22" y="182" fill="#6E7681">filter <tspan fill="#C9D1D9">(user_id = 42)</tspan></text>
      <text x="22" y="201" fill="#6E7681">at     <tspan fill="#7DD3FC">src/routes/orders.ts:42</tspan></text>

      <text x="22" y="240" fill="#2DD4BF">CREATE INDEX CONCURRENTLY idx_orders_user_id</text>
      <text x="22" y="258" fill="#2DD4BF">  ON "orders" ("user_id");</text>
    </g>
  </g>

  <!-- read vs returned: the whole argument, in one bar -->
  <g transform="translate(608, 360)">
    <text x="0" y="0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#6E7681" letter-spacing="1.2">ROWS READ VS ROWS RETURNED</text>

    <rect x="0" y="16" width="524" height="10" rx="5" fill="#FBBF24" opacity="0.75"/>
    <text x="0" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8B949E">60,000 read</text>

    <rect x="0" y="60" width="8" height="10" rx="4" fill="#2DD4BF"/>
    <text x="18" y="70" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8B949E">12 returned</text>
  </g>
</svg>
